<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirish – KompSavod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="dark-bg">
<div class="auth-page">
  <div class="wrap"><nav class="nav"><a class="brand" href="/" id="brand">KompSavod</a></nav></div>

  <main class="auth-center">
    <div class="auth-card">
      <div style="display:flex;gap:8px;margin-bottom:18px">
        <a class="btn btn-sm" style="flex:1" id="tabLogin" href="#kirish">Kirish</a>
        <a class="btn btn-sm" style="flex:1" id="tabSignup" href="#royxat">Ro‘yxatdan o‘tish</a>
      </div>
      <div class="form-error hidden" id="formError" role="alert"></div>

      <form id="authForm" novalidate>
        <h1 id="title">Kirish</h1>
        <p class="lead" id="lead">Email va parolingizni kiriting.</p>

        <div id="signupFields" class="hidden">
          <div class="field">
            <label for="name">Ism va familiya</label>
            <input id="name" class="input" type="text" autocomplete="name" maxlength="80">
          </div>
          <div class="field">
            <label for="region">Hudud</label>
            <select id="region" class="input"></select>
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" class="input" type="email" autocomplete="email" placeholder="ism@gmail.com" maxlength="120">
        </div>
        <div class="field">
          <label for="password">Parol</label>
          <input id="password" class="input" type="password" autocomplete="current-password" maxlength="128">
          <span class="hint hidden" id="pwHint">Kamida 6 ta belgi.</span>
        </div>
        <div class="field hidden" id="password2Field">
          <label for="password2">Parolni takrorlang</label>
          <input id="password2" class="input" type="password" autocomplete="new-password" maxlength="128">
        </div>

        <button class="btn btn-indigo" style="width:100%" id="submitBtn" type="submit">Kirish</button>
        <p style="margin:16px 0 0;text-align:center" id="forgotRow">
          <button type="button" class="link-btn" id="forgotBtn">Parolni unutdingizmi?</button>
        </p>
      </form>
    </div>
  </main>
</div>

<script type="module">
import { auth, db, showConfigWarning, loadProfile, toast, REGIONS, LOGO_SVG } from "/assets/app.js";
import {
  createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

document.getElementById("brand").insertAdjacentHTML("afterbegin", LOGO_SVG);
const $ = (id) => document.getElementById(id);
const setError = (msg) => { $("formError").textContent = msg || ""; $("formError").classList.toggle("hidden", !msg); };
$("region").innerHTML = `<option value="">Tanlang</option>` + REGIONS.map(r => `<option>${r}</option>`).join("");

let signup = false;
function setMode() {
  signup = location.hash.startsWith("#royxat");
  $("tabLogin").className = `btn btn-sm ${signup ? "btn-light" : "btn-indigo"}`;
  $("tabSignup").className = `btn btn-sm ${signup ? "btn-indigo" : "btn-light"}`;
  $("title").textContent = signup ? "Ro‘yxatdan o‘tish" : "Kirish";
  $("lead").textContent = signup ? "Ma’lumotlaringizni kiriting va parol o‘ylab toping." : "Email va parolingizni kiriting.";
  $("submitBtn").textContent = signup ? "Ro‘yxatdan o‘tish" : "Kirish";
  $("signupFields").classList.toggle("hidden", !signup);
  $("password2Field").classList.toggle("hidden", !signup);
  $("pwHint").classList.toggle("hidden", !signup);
  $("forgotRow").classList.toggle("hidden", signup);
  $("password").autocomplete = signup ? "new-password" : "current-password";
  setError("");
  (signup ? $("name") : $("email")).focus();
}
window.addEventListener("hashchange", setMode);
setMode();

const AUTH_ERRORS = {
  "auth/invalid-email": "Email manzil noto‘g‘ri. Masalan: ism@gmail.com",
  "auth/email-already-in-use": "Bu email bilan avval ro‘yxatdan o‘tilgan. «Kirish» bo‘limidan kiring.",
  "auth/weak-password": "Parol kamida 6 ta belgidan iborat bo‘lsin.",
  "auth/invalid-credential": "Email yoki parol noto‘g‘ri.",
  "auth/wrong-password": "Email yoki parol noto‘g‘ri.",
  "auth/user-not-found": "Email yoki parol noto‘g‘ri.",
  "auth/user-disabled": "Akkauntingiz vaqtincha yopilgan.",
  "auth/too-many-requests": "Juda ko‘p noto‘g‘ri urinish. Birozdan keyin qayta urinib ko‘ring.",
  "auth/network-request-failed": "Internet aloqasi yo‘q. Ulanishni tekshiring.",
  "auth/operation-not-allowed": "Email orqali kirish hali yoqilmagan (Firebase sozlamasi).",
  "auth/configuration-not-found": "Email orqali kirish hali yoqilmagan (Firebase sozlamasi).",
  "auth/unauthorized-domain": "Bu domen Firebase’da ruxsat etilganlar ro‘yxatida yo‘q."
};
const errText = (e) => AUTH_ERRORS[e?.code] || "Xatolik yuz berdi. Qayta urinib ko‘ring.";

let busy = false;

async function goToCabinet(user) {
  const profile = await loadProfile(user.uid);
  if (!profile) return false;
  try { await updateDoc(doc(db, "users", user.uid), { lastLoginAt: serverTimestamp() }); } catch (e) { console.warn(e); }
  location.href = profile.role === "admin" ? "/admin" : "/kabinet";
  return true;
}

async function createProfile(user, name, region) {
  await setDoc(doc(db, "users", user.uid), {
    name, region,
    email: user.email,
    status: "pending",
    role: "student",
    courses: [],
    createdAt: serverTimestamp(),
    lastLoginAt: serverTimestamp()
  });
}

if (showConfigWarning()) {
  $("submitBtn").disabled = true;
} else {
  $("authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("email").value.trim().toLowerCase();
    const password = $("password").value;
    const name = $("name").value.trim().replace(/\s+/g, " ");
    const region = $("region").value;
    if (signup) {
      if (name.length < 2) return setError("Ism va familiyangizni yozing.");
      if (!region) return setError("Hududingizni tanlang.");
    }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return setError("Email manzil noto‘g‘ri. Masalan: ism@gmail.com");
    if (password.length < (signup ? 6 : 1)) return setError(signup ? "Parol kamida 6 ta belgidan iborat bo‘lsin." : "Parolni kiriting.");
    if (signup && password !== $("password2").value) return setError("Parollar bir xil emas.");

    setError("");
    busy = true;
    const btn = $("submitBtn");
    btn.disabled = true; btn.textContent = "Kuting…";
    try {
      if (signup) {
        // Akkaunt bor-u profil yo'q bo'lsa (oldingi urinish chala qolgan) – faqat profilni yaratamiz
        const user = auth.currentUser?.email === email
          ? auth.currentUser
          : (await createUserWithEmailAndPassword(auth, email, password)).user;
        await createProfile(user, name, region);
        toast("Ro‘yxatdan o‘tdingiz!", "success");
        location.href = "/kabinet";
        return;
      }
      const cred = await signInWithEmailAndPassword(auth, email, password);
      if (!(await goToCabinet(cred.user))) {
        location.hash = "#royxat";
        $("email").value = email;
        setError("Profilingiz to‘liq emas: ism va hududni kiriting, parolni qayta yozing.");
      }
    } catch (err) {
      console.error(err);
      setError(errText(err));
    } finally {
      busy = false;
      btn.disabled = false; btn.textContent = signup ? "Ro‘yxatdan o‘tish" : "Kirish";
    }
  });

  $("forgotBtn").addEventListener("click", async () => {
    const email = $("email").value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return setError("Avval email manzilingizni yozing.");
    try {
      await sendPasswordResetEmail(auth, email);
      setError("");
      toast("Parolni tiklash havolasi emailingizga yuborildi.", "success");
    } catch (err) {
      console.error(err);
      setError(errText(err));
    }
  });

  // Oldin kirgan bo'lsa – to'g'ridan-to'g'ri kabinetga
  onAuthStateChanged(auth, async (u) => {
    if (u && !busy) {
      try { await goToCabinet(u); } catch (e) { console.error(e); }
    }
  });
}
</script>
</body>
</html>
